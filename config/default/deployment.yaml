apiVersion: apps/v1
kind: Deployment
metadata:
  name: onyxia-janitor
  namespace: onyxia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onyxia-janitor
  template:
    metadata:
      labels:
        app: onyxia-janitor
    spec:
      serviceAccountName: onyxia-janitor-sa
      containers:
      - name: onyxia-janitor
        image: europe-west4-docker.pkg.dev/artifact-registry-5n/dapla-lab-docker/onyxia-janitor:v0.0.1
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
        env:
        - name: KUBECONFIG
          value: /root/.kube/config