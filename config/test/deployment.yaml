apiVersion: apps/v1
kind: Deployment
metadata:
  name: onyxia-janitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onyxia-janitor
  template:
    metadata:
      labels:
        app: onyxia-janitor
    spec:
      containers:
      - name: onyxia-janitor
        image: onyxia-janitor:latest
        imagePullPolicy: Never
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
        env:
        - name: KUBECONFIG
          value: /root/.kube/config