apiVersion: v1
kind: ServiceAccount
metadata:
  name: helm-cronjob-sa
  namespace: onyxia
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: helm-cronjob-cluster-role
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["*"] 
    resources: ["*"] 
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: helm-cronjob-cluster-binding
subjects:
  - kind: ServiceAccount
    name: helm-cronjob-sa
    namespace: onyxia
roleRef:
  kind: ClusterRole
  name: helm-cronjob-cluster-role
  apiGroup: rbac.authorization.k8s.io